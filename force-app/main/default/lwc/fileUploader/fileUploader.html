<template>    

    <template if:true={currentPage.first}>
        <lightning-card title="Select a type" class="slds-text-align_center" >        
        <lightning-combobox
            class="slds-p-around_medium"
            name="progress"
            label="File Type"
            value={value}
            placeholder="Select Progress"
            options={options}
            onchange={handleChange}></lightning-combobox>

        <p>Selected value is: {value}</p>
              
        </lightning-card>

    </template>



    <template if:true={currentPage.second}>
  <lightning-card title="File Uploader" class="slds-text-align_center" >        
        <lightning-file-upload
        label="Attach receipt"
        name="fileUploader"
        accept={acceptedFormats}
        record-id={recordId}
        onuploadfinished={handleUploadFinished}
        multiple
    >
    </lightning-file-upload>

    

    <!-- <p slot="footer"> -->
        <!-- <template if:true={uploadedFiles}> -->
            <!-- <template for:each={uploadedFiles} for:item="file" for:index="index"> -->
        <!-- <p key={file.name}>{file.index}. {file.name} Uploaded </p> -->
         
      <!-- </template>  -->
    <!-- </template> -->
    <!-- </p> -->
  </lightning-card>
  </template>

  <div class="slds-m-top_medium"></div>

  <lightning-progress-indicator  current-step={currentStep} type="base" variant="base">
    <lightning-progress-step label="Step 1" value="1"></lightning-progress-step>
    <lightning-progress-step label="Step 2" value="2"></lightning-progress-step>
  </lightning-progress-indicator>

  <template if:true={isStepOne} >
    <!-- <p class="slds-text-align_center">This is Step 1 content</p> -->
  </template>
  <template if:true={isStepTwo}>
    <!-- <p class="slds-text-align_center">This is Step 2 content</p> -->
  </template>
  

  <div class="slds-m-top_medium slds-grid slds-grid_align-spread">
    <lightning-button label="Previous" onclick={handlePrevious} class="" disabled={isFirstStep}></lightning-button>
    <lightning-button label="Next" onclick={handleNext} disabled={isLastStep}></lightning-button>
  </div>
</template>
